;; Package flake8 config: ament's bundled ament_flake8.ini with two
;; deliberate deviations, both to match the established repo-wide style
;; rather than restyle this one package against its siblings:
;;   - inline-quotes double (the whole repo uses double quotes; ament's
;;     default flake8-quotes preference is single)
;;   - per-file E402 allowance in test/: the headless tests must set
;;     ROS_DOMAIN_ID before importing rclpy, so env-setup precedes imports.
[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
inline-quotes = double
max-line-length = 99
per-file-ignores =
    test/*.py:E402
show-source = true
statistics = true
